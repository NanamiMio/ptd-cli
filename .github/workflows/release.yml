name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../ptd-cli-${{ github.ref_name }}-${{ matrix.target }}.tar.gz ptd ptd-host
          cd ../../..

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/ptd.exe","target/${{ matrix.target }}/release/ptd-host.exe" -DestinationPath "ptd-cli-${{ github.ref_name }}-${{ matrix.target }}.zip"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ptd-cli-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            ptd-cli-${{ github.ref_name }}-${{ matrix.target }}.zip

  bump-manifests:
    name: Bump Homebrew Formula & Scoop Manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update Homebrew Formula & Scoop Manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

          # Calculate SHA256 for all release packages
          MACOS_ARM64_SHA=$(curl -sL "${BASE_URL}/ptd-cli-${GITHUB_REF_NAME}-aarch64-apple-darwin.tar.gz" | sha256sum | awk '{print $1}')
          MACOS_X86_64_SHA=$(curl -sL "${BASE_URL}/ptd-cli-${GITHUB_REF_NAME}-x86_64-apple-darwin.tar.gz" | sha256sum | awk '{print $1}')
          LINUX_ARM64_SHA=$(curl -sL "${BASE_URL}/ptd-cli-${GITHUB_REF_NAME}-aarch64-unknown-linux-gnu.tar.gz" | sha256sum | awk '{print $1}')
          LINUX_X86_64_SHA=$(curl -sL "${BASE_URL}/ptd-cli-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz" | sha256sum | awk '{print $1}')
          WINDOWS_X86_64_SHA=$(curl -sL "${BASE_URL}/ptd-cli-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc.zip" | sha256sum | awk '{print $1}')

          # In-place update Homebrew Formula
          sed -i.bak -E \
            -e "s|version \".*\"|version \"${VERSION}\"|" \
            -e "s|https://github.com/[^/]+/[^/\"]+|https://github.com/${GITHUB_REPOSITORY}|g" \
            -e "s|\"aarch64-apple-darwin\" *=> *\".*\"|\"aarch64-apple-darwin\"      => \"${MACOS_ARM64_SHA}\"|" \
            -e "s|\"x86_64-apple-darwin\" *=> *\".*\"|\"x86_64-apple-darwin\"       => \"${MACOS_X86_64_SHA}\"|" \
            -e "s|\"aarch64-unknown-linux-gnu\" *=> *\".*\"|\"aarch64-unknown-linux-gnu\" => \"${LINUX_ARM64_SHA}\"|" \
            -e "s|\"x86_64-unknown-linux-gnu\" *=> *\".*\"|\"x86_64-unknown-linux-gnu\"  => \"${LINUX_X86_64_SHA}\"|" \
            Formula/ptd-cli.rb && rm -f Formula/ptd-cli.rb.bak

          # In-place update Scoop Manifest (Version, URL, Hash, Homepage, Autoupdate)
          jq --arg v "$VERSION" \
             --arg u "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/ptd-cli-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc.zip" \
             --arg hash "$WINDOWS_X86_64_SHA" \
             --arg auto_u "https://github.com/${GITHUB_REPOSITORY}/releases/download/v\$version/ptd-cli-v\$version-x86_64-pc-windows-msvc.zip" \
             --arg hp "https://github.com/${GITHUB_REPOSITORY}" \
             '.version = $v | .homepage = $hp | .architecture["64bit"].url = $u | .architecture["64bit"].hash = $hash | .autoupdate.architecture["64bit"].url = $auto_u' \
             bucket/ptd-cli.json > bucket/ptd-cli.tmp.json && mv bucket/ptd-cli.tmp.json bucket/ptd-cli.json

          # Commit and push both in a single commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ptd-cli.rb bucket/ptd-cli.json
          git commit -m "chore(release): bump homebrew and scoop to ${GITHUB_REF_NAME} [skip ci]" || exit 0
          git push origin HEAD:${{ github.event.repository.default_branch }}
